<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#090c12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="חדר מצב">
<title>חילופי שלטון · חדר מצב</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090c12; --p1:#10151e; --p2:#161d29; --p3:#1d2533; --line:#232c3b; --line2:#2d3849;
  --ink:#eef1f6; --ink2:#c3cad6; --muted:#8a94a7; --dim:#5f697c;
  --red:#ff4458; --amber:#ffb224; --green:#2fd08a; --cyan:#45c3ff; --blue:#5b8cff; --violet:#b07cff;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
.wrap{max-width:760px;margin:0 auto}
.hide{display:none!important}

/* ---------- top bar ---------- */
.bar{padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:40;background:rgba(9,12,18,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar .row{display:flex;align-items:center;gap:8px;padding:10px 14px}
.logo{display:flex;align-items:center;gap:9px}
.logo .mk{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--red),#ff7a45);display:grid;place-items:center;font-weight:900;font-size:15px;color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.08) inset}
.logo b{font-size:16.5px;font-weight:800;letter-spacing:-.3px;display:block;line-height:1.05}
.logo small{font-size:11px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:5px;white-space:nowrap}
.live{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.live.on{background:var(--red);box-shadow:0 0 0 0 rgba(255,68,88,.6);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(255,68,88,0)}100%{box-shadow:0 0 0 0 rgba(255,68,88,0)}}
.sp{flex:1}
.ib{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--p2);border:1px solid var(--line);color:var(--ink2)}
.ib.on{background:var(--ink);color:var(--bg)}
.ib.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sbox{padding:0 14px 10px}
.sbox input{width:100%;font:inherit;font-size:15px;padding:10px 13px;border-radius:12px;border:1px solid var(--line2);background:var(--p2);color:var(--ink);outline:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--p2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;white-space:nowrap;font-weight:600;color:var(--ink2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

main{padding:12px 12px 110px}
.h{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.4px;margin:22px 4px 10px;display:flex;align-items:center;gap:8px}
.h .c{color:var(--dim);font-weight:600}
.h a{margin-inline-start:auto;color:var(--cyan);font-weight:700}

/* ---------- status (hero) ---------- */
.status{position:relative;background:radial-gradient(120% 80% at 100% 0%,rgba(91,140,255,.16),transparent 60%),radial-gradient(90% 70% at 0% 100%,rgba(255,68,88,.10),transparent 60%),var(--p1);border:1px solid var(--line2);border-radius:22px;padding:16px 15px 14px;overflow:hidden}
.kick{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.5px}
.pm{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-top:3px}
.pm b{font-size:24px;font-weight:900;letter-spacing:-.6px}
.badge{font-size:11.5px;font-weight:800;border-radius:7px;padding:2px 8px;background:rgba(255,178,36,.14);color:var(--amber);border:1px solid rgba(255,178,36,.3)}
.badge.g{background:rgba(47,208,138,.12);color:var(--green);border-color:rgba(47,208,138,.3)}
.badge.r{background:rgba(255,68,88,.14);color:var(--red);border-color:rgba(255,68,88,.35)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.tile{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:10px 11px}
.tile .l{font-size:11.5px;color:var(--muted);font-weight:700}
.tile .v{font-size:16px;font-weight:800;margin-top:2px;line-height:1.25}
.tile .s{font-size:12px;color:var(--ink2);margin-top:3px}
.prog{height:5px;border-radius:3px;background:var(--p3);margin-top:8px;overflow:hidden;position:relative}
.prog i{position:absolute;inset:0 0 0 auto;background:var(--cyan);border-radius:3px}
.prog.warn i{background:var(--amber)} .prog.bad i{background:var(--red)}
.steps{display:flex;gap:0;margin-top:16px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.steps::-webkit-scrollbar{display:none}
.step{flex:1;min-width:66px;text-align:center;position:relative;font-size:10.5px;font-weight:700;color:var(--dim);line-height:1.25}
.step .d{width:14px;height:14px;border-radius:50%;margin:0 auto 6px;background:var(--p3);border:2px solid var(--line2);position:relative;z-index:1}
.step::before{content:"";position:absolute;top:6px;right:50%;width:100%;height:2px;background:var(--line2)}
.step:first-child::before{display:none}
.step.done{color:var(--ink2)} .step.done .d{background:var(--green);border-color:var(--green)}
.step.done::before{background:var(--green)}
.step.cur{color:var(--ink)} .step.cur .d{background:var(--bg);border-color:var(--cyan);box-shadow:0 0 0 4px rgba(69,195,255,.18)}
.step.cur::before{background:linear-gradient(to left,var(--green),var(--cyan))}
.foot{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);font-weight:600}
.alt{margin-top:12px;font-size:12.5px;color:var(--ink2);background:rgba(255,68,88,.08);border:1px solid rgba(255,68,88,.25);border-radius:12px;padding:8px 10px}
.tally{margin-top:14px}
.tbar{position:relative;height:12px;border-radius:6px;overflow:hidden;display:flex;background:var(--p3)}
.tbar > div{height:100%}
.tbar .m{position:absolute;top:0;bottom:0;width:2px;background:#fff;right:calc(61/120*100%);box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.tleg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:7px;font-size:12px;color:var(--ink2)}
.tleg span{display:inline-flex;align-items:center;gap:5px}
.tleg i{width:8px;height:8px;border-radius:2px;display:inline-block}
.tleg b{color:var(--ink)}

/* ---------- briefing ---------- */
.brief{margin-top:12px;background:var(--p1);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
.brief .t{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800}
.brief .t small{margin-inline-start:auto;color:var(--muted);font-weight:600;font-size:11.5px}
.brief ol{margin:9px 0 0;padding:0;list-style:none;counter-reset:b}
.brief li{counter-increment:b;display:flex;gap:9px;font-size:14.5px;line-height:1.5;color:var(--ink2);padding:5px 0;border-top:1px solid var(--line)}
.brief li:first-child{border-top:0}
.brief li::before{content:counter(b);flex:none;width:20px;height:20px;border-radius:6px;background:var(--p3);color:var(--ink);font-size:11.5px;font-weight:800;display:grid;place-items:center;margin-top:2px}
.brief.wait{color:var(--muted);font-size:13.5px;line-height:1.55}

/* ---------- now strip ---------- */
.now{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px}
.now::-webkit-scrollbar{display:none}
.nw{flex:none;width:78%;max-width:330px;background:linear-gradient(160deg,rgba(255,68,88,.16),rgba(255,68,88,.03) 60%),var(--p1);border:1px solid rgba(255,68,88,.32);border-radius:var(--r);padding:11px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.nw .k{font-size:11px;font-weight:800;color:var(--red);display:flex;gap:6px;align-items:center}
.nw .tt{font-size:15px;font-weight:700;line-height:1.38}
.nw .ft{margin-top:auto;display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted)}

/* ---------- story rows ---------- */
.list{background:var(--p1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.st{display:flex;gap:11px;padding:12px 12px 12px 8px;border-top:1px solid var(--line);cursor:pointer;position:relative}
.st:first-child{border-top:0}
.st:active{background:var(--p2)}
.sc{flex:none;width:34px;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:2px}
.sc b{font-size:19px;font-weight:900;line-height:1}
.sc i{width:4px;flex:1;min-height:18px;border-radius:2px;background:var(--dim);opacity:.9}
.sc.i9 b{color:var(--red)} .sc.i9 i{background:var(--red)}
.sc.i7 b{color:var(--amber)} .sc.i7 i{background:var(--amber)}
.sc.i5 b{color:var(--cyan)} .sc.i5 i{background:var(--cyan)}
.sc.q b{color:var(--dim)}
.sb{flex:1;min-width:0}
.kk{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kk .fl{font-weight:800;border-radius:5px;padding:0 5px;line-height:17px}
.fl.brk{background:var(--red);color:#fff} .fl.hot{background:rgba(255,178,36,.16);color:var(--amber)} .fl.nwq{background:rgba(69,195,255,.15);color:var(--cyan)} .fl.q{background:var(--p3);color:var(--muted)}
.tt{font-size:15.5px;font-weight:700;line-height:1.4;margin-top:3px}
.st.big .tt{font-size:18.5px;font-weight:800;line-height:1.32}
.sm{font-size:13.5px;color:var(--muted);line-height:1.45;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.src{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:12px;color:var(--ink2);font-weight:600}
.lg{width:18px;height:18px;border-radius:5px;flex:none;object-fit:contain;background:#fff;display:inline-grid;place-items:center;font-size:10px;font-weight:800;color:#fff;vertical-align:middle}
.stack{display:inline-flex}
.stack .lg{margin-inline-start:-5px;box-shadow:0 0 0 2px var(--p1)}
.stack .lg:first-child{margin-inline-start:0}
.go{flex:none;align-self:center;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--muted);background:var(--p2);border:1px solid var(--line)}
.more{display:block;text-align:center;padding:11px;font-size:13px;font-weight:700;color:var(--cyan);border-top:1px solid var(--line)}

/* ---------- wire ---------- */
.wr{display:flex;gap:10px;padding:10px 12px;border-top:1px solid var(--line);align-items:flex-start}
.wr:first-child{border-top:0}
.wr .tm{flex:none;width:40px;font-size:12px;font-weight:800;color:var(--muted);direction:ltr;text-align:right;padding-top:2px}
.wr .x{flex:1;min-width:0}
.wr .o{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--muted)}
.wr .t{display:block;font-size:14.5px;line-height:1.42;margin-top:3px;color:var(--ink)}
.wr .im{flex:none;font-size:11px;font-weight:900;border-radius:6px;padding:1px 6px;background:var(--p3);color:var(--ink2);margin-top:2px}
.wr .im.i9{background:var(--red);color:#fff} .wr .im.i7{background:var(--amber);color:#111} .wr .im.i5{background:rgba(69,195,255,.2);color:var(--cyan)}
.hr{font-size:11.5px;font-weight:800;color:var(--muted);padding:7px 12px;background:var(--p2);border-top:1px solid var(--line)}
.hr:first-child{border-top:0}

/* ---------- map ---------- */
.card{background:var(--p1);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h3{margin:0;font-size:15.5px;font-weight:800}
.card .sub{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:3px}
.big .tbar{height:26px;border-radius:9px}
.big .tbar > div{display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;overflow:hidden}
.pr{display:grid;grid-template-columns:32px 1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pr:first-of-type{border-top:0}
.pr .n{font-size:16px;font-weight:900;text-align:center}
.pr .p{font-weight:700;font-size:14.5px}
.pr .tags{grid-column:2 / 4;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.u{background:var(--p3);color:var(--muted)}
.pr .ev{font-size:11.5px;color:var(--cyan);font-weight:700}
.seatsbar{width:100%;height:4px;border-radius:2px;background:var(--p3);grid-column:1 / 4;overflow:hidden}
.seatsbar i{display:block;height:100%;background:var(--line2)}
.proc{counter-reset:s;margin:0;padding:0;list-style:none}
.proc li{counter-increment:s;display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.5;color:var(--ink2)}
.proc li:first-child{border-top:0}
.proc li::before{content:counter(s);flex:none;width:22px;height:22px;border-radius:7px;background:var(--p3);display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--ink)}
.proc b{color:var(--ink)}

/* ---------- timeline ---------- */
.tl{position:relative;padding-right:18px}
.tl::before{content:"";position:absolute;right:5px;top:6px;bottom:6px;width:2px;background:var(--line2)}
.ev2{position:relative;padding:6px 0 12px}
.ev2::before{content:"";position:absolute;right:-17px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--p3);border:2px solid var(--line2)}
.ev2.done::before{background:var(--green);border-color:var(--green)}
.ev2.next::before{background:var(--bg);border-color:var(--cyan);box-shadow:0 0 0 4px rgba(69,195,255,.18)}
.ev2 .dt{font-size:11.5px;font-weight:800;color:var(--muted)}
.ev2 .lb{font-size:14.5px;font-weight:700;margin-top:1px}
.ev2 .cd{font-size:12px;color:var(--cyan);font-weight:700}
.ev2 a{font-size:12px;color:var(--cyan);font-weight:700}

/* ---------- bottom nav ---------- */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:45;background:rgba(9,12,18,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:flex}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;font-size:11px;font-weight:700;color:var(--dim);position:relative}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--ink)}
.nav button.on::after{content:"";position:absolute;top:0;width:28px;height:2.5px;border-radius:2px;background:var(--cyan)}
.nav .n{position:absolute;top:5px;left:calc(50% - 22px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;line-height:17px;padding:0 4px}

/* ---------- toast alerts ---------- */
#toasts{position:fixed;top:60px;left:0;right:0;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;padding:0 12px}
.toast{pointer-events:auto;width:100%;max-width:520px;display:flex;gap:10px;align-items:flex-start;background:var(--red);color:#fff;border-radius:16px;padding:11px 12px;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:drop .35s ease}
.toast.o{background:#c97800}
@keyframes drop{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.toast .k{font-size:11px;font-weight:800;opacity:.9}
.toast .t{font-weight:800;font-size:14px;line-height:1.35;margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.toast .x{margin-inline-start:auto;background:rgba(255,255,255,.2);border-radius:9px;width:28px;height:28px;flex:none;color:#fff}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.panel{background:var(--p1);border:1px solid var(--line2);border-bottom:0;width:100%;max-width:760px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px 34px;animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:4px auto 12px}
.dh .kk{margin-bottom:4px}
.dh h2{margin:0;font-size:21px;line-height:1.3;font-weight:800}
.dh p{margin:8px 0 0;font-size:15px;line-height:1.55;color:var(--ink2)}
.why{margin-top:12px;background:rgba(69,195,255,.08);border:1px solid rgba(69,195,255,.22);border-radius:12px;padding:9px 11px;font-size:13.5px;line-height:1.5;color:var(--ink2)}
.why b{color:var(--cyan)}
.primary{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;background:var(--ink);color:var(--bg);border-radius:13px;padding:12px;font-weight:800;font-size:15px}
.arts{margin-top:16px}
.ar{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.42}
.ar .o{flex:none;display:flex;align-items:center;gap:6px;font-weight:800;font-size:12px;width:96px}
.ar .t{flex:1;color:var(--ink2)}
.ar .tm{flex:none;font-size:11.5px;color:var(--muted);direction:ltr}
.calc{margin-top:14px;background:var(--p2);border-radius:12px;padding:10px 12px;font-size:13px}
.calc .r{display:flex;justify-content:space-between;padding:2px 0;color:var(--ink2)}
.calc .r b{color:var(--ink)}
.calc .tot{border-top:1px solid var(--line2);margin-top:5px;padding-top:6px;font-weight:800}
.votes{display:flex;gap:8px;margin-top:12px}
.votes button{flex:1;border:1px solid var(--line2);background:var(--p2);border-radius:12px;padding:10px 4px;font-size:13.5px;font-weight:800;color:var(--ink2)}
.votes button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hint{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.5}
.seg{display:flex;background:var(--p2);border-radius:12px;padding:3px;gap:3px;margin-bottom:6px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-weight:800;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--p3);color:var(--ink)}
.doc{font-size:14px;line-height:1.65;color:var(--ink2)}
.doc h4{margin:16px 0 4px;font-size:14.5px;color:var(--ink)}
.doc p{margin:4px 0}
.doc b{color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);gap:12px;font-size:14.5px}
.row select{font:inherit;padding:6px 8px;border-radius:9px;border:1px solid var(--line2);background:var(--p2);color:var(--ink)}
.tg{width:46px;height:28px;border-radius:14px;background:var(--p3);position:relative;flex:none}
.tg::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--green)}
.tg.on::after{right:21px}
.srow{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.srow .dt{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.srow .dt.bad{background:var(--amber)} .srow .dt.off{background:var(--dim)}
.srow .nm{flex:1;min-width:0}
.srow .nm small{display:block;color:var(--muted);font-size:11.5px}
.srow .c{font-weight:900;color:var(--ink2)}

    try {
      const list = await sql("select public.sources_json() as f"); const act = list.filter((s) => s.active), off = list.filter((s) => !s.active);
      const r = (s) => { const ok = s.last_ok_at && now() - Date.parse(s.last_ok_at) < 30 * 60000; return `<div class="srow"><span class="dt ${!s.active ? "off" : ok ? "" : "bad"}"></span><span class="nm"><b>${s.kind === "telegram" ? "✈︎ " : ""}${esc(s.name)}</b><small>${s.active ? (s.last_ok_at ? "נקרא " + ago(s.last_ok_at) : "טרם נקרא") : (s.err && /40[34]|not a feed|no telegram/.test(s.err) ? "חסום / לא זמין" : "לא פעיל")} · ${s.region === "world" ? "עולם" : "ישראל"}</small></span><span class="c">${s.n24 || 0}</span></div>`; };
      const el = $("srcList"); if (el) el.innerHTML = `<p class="hint">המספר = ידיעות פוליטיות ב־24 השעות האחרונות. Google News מביא גם את כאן, N12, חדשות 13, ערוץ 14, Times of Israel, Reuters ו־AP.</p><h4>פעילים (${act.length})</h4>${act.map(r).join("")}<h4>לא פעילים / חסומים (${off.length})</h4>${off.map(r).join("")}`;
    } catch { const el = $("srcList"); if (el) el.textContent = "לא הצלחתי לטעון את רשימת המקורות."; }
  }

  // ---------- events ----------
  $("nav").addEventListener("click", (e) => { const b = e.target.closest("button[data-tab]"); if (!b) return; S.tab = b.dataset.tab; [...$("nav").children].forEach((x) => x.classList.toggle("on", x === b)); S.showAll = false; S.fresh = new Set(); render(); const v = $("view"); v.classList.remove("fade"); void v.offsetWidth; v.classList.add("fade"); window.scrollTo({ top: 0 }); try { navigator.vibrate && navigator.vibrate(6); } catch {} });
  $("view").addEventListener("click", (e) => { if (e.target.closest("[data-status]")) { S.statusOpen = !S.statusOpen; store.set("statusOpen", S.statusOpen); render(); return; } const ar = e.target.closest("[data-arena]"); if (ar) { openArena(ar.dataset.arena); return; } if (e.target.closest("[data-how]")) { openMenu("how"); return; } if (e.target.closest("a.go, a.wr, a.ev, a.pr")) return; const o = e.target.closest("[data-open]"); if (o) { e.preventDefault(); openStory(+o.dataset.open); } });
  $("chips").addEventListener("click", (e) => { const b = e.target.closest("[data-actor]"); if (!b) return; S.actor = S.actor === b.dataset.actor ? null : b.dataset.actor; render(); });
  $("bSearch").addEventListener("click", () => { S.filtersOpen = !S.filtersOpen; $("sbox").classList.toggle("hide", !S.filtersOpen); $("bSearch").classList.toggle("on", S.filtersOpen); if (S.filtersOpen) $("q").focus(); else { S.q = ""; S.actor = null; $("q").value = ""; } render(); });
  $("q").addEventListener("input", (e) => { S.q = e.target.value.trim(); render(); });
  $("bRefresh").addEventListener("click", () => { unlock(); collectNow(); });
  $("bMenu").addEventListener("click", () => { unlock(); openMenu(); });
  $("sheet").addEventListener("click", (e) => {
    if (e.target.id === "sheet" || e.target.closest("#xSheet")) { closeSheet(); return; }
    const v = e.target.closest("[data-vote]"); if (v) { vote(+v.dataset.id, +v.dataset.vote); return; }
    const sg = e.target.closest("[data-seg]"); if (sg) { openMenu(sg.dataset.seg); return; }
    if (e.target.id === "tVel") { S.vel = !S.vel; store.set("vel", S.vel); openMenu("set"); }
    if (e.target.id === "tSnd") { S.snd = !S.snd; store.set("snd", S.snd); unlock(); if (S.snd) beep(); openMenu("set"); }
    if (e.target.id === "tAI") { S.aiOn = !S.aiOn; store.set("aiOn", S.aiOn); openMenu("set"); if (S.aiOn) aiTick(true); }
    if (e.target.id === "doInstall" && deferredInstall) { deferredInstall.prompt(); deferredInstall = null; closeSheet(); return; }
    if (e.target.id === "forceBrief") { closeSheet(); maybeBrief(true); }
  });
  $("sheet").addEventListener("change", (e) => { if (e.target.id === "thr") { S.thr = +e.target.value; store.set("thr", S.thr); } });
  (function(){
    const panel = $("panel"); let y0 = null, dy = 0;
    panel.addEventListener("touchstart", (e) => { if (panel.scrollTop > 0) return; y0 = e.touches[0].clientY; dy = 0; }, { passive: true });
    panel.addEventListener("touchmove", (e) => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); if (dy > 0) panel.style.transform = `translateY(${dy}px)`; }, { passive: true });
    panel.addEventListener("touchend", () => { if (y0 == null) return; panel.style.transform = ""; if (dy > 110) closeSheet(); y0 = null; });
    const ptr = $("ptr"), ptrT = $("ptrT"), mainEl = document.querySelector("main.wrap"), TH = 64;
    let p0 = null, px = 0, pdist = 0, lock = null, busy = false, armed = false;
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const buzz = (n) => { try { navigator.vibrate && navigator.vibrate(n); } catch {} };
    function setP(d, anim){
      pdist = d; const tr = anim ? "transform .28s cubic-bezier(.2,.8,.2,1), opacity .2s" : "none";
      mainEl.style.transition = tr; mainEl.style.transform = d ? `translateY(${d}px)` : "";
      ptr.style.transition = tr; ptr.style.opacity = d ? Math.min(1, d / 28) : 0;
      ptr.style.transform = `translate(-50%, ${-48 + Math.min(d, TH) * 0.95}px)`;
      if (!busy) ptr.querySelector("svg").style.transform = `rotate(${Math.min(1, d / TH) * 320}deg)`;
    }
    function resetP(){ p0 = null; lock = null; armed = false; if (!busy) { setP(0, true); ptr.classList.remove("ready"); } }
    window.addEventListener("touchstart", (e) => {
      if (busy || window.scrollY > 2 || $("sheet").classList.contains("open") || e.touches.length > 1 || e.target.closest("input,textarea,.now,.chips,.steps")) { p0 = null; return; }
      p0 = e.touches[0].clientY; px = e.touches[0].clientX; lock = null; armed = false;
    }, { passive: true });
    window.addEventListener("touchmove", (e) => {
      if (p0 == null || busy) return;
      const dy = e.touches[0].clientY - p0, dx = e.touches[0].clientX - px;
      if (lock == null) { if (Math.abs(dy) < 6 && Math.abs(dx) < 6) return; lock = dy > 0 && Math.abs(dy) > Math.abs(dx) * 1.2 ? "v" : "x"; }
      if (lock !== "v" || window.scrollY > 2) { resetP(); return; }
      if (e.cancelable) e.preventDefault();
      const d = dy <= 0 ? 0 : Math.min(130, dy * 0.5);
      setP(d, false);
      const ready = d >= TH;
      if (ready !== armed) { armed = ready; ptr.classList.toggle("ready", ready); ptrT.textContent = ready ? "שחררו לרענון" : "משכו לרענון"; if (ready) buzz(8); }
    }, { passive: false });
    window.addEventListener("touchend", async () => {
      if (p0 == null || busy) return;
      const go = armed; p0 = null; lock = null; armed = false; ptr.classList.remove("ready");
      if (!go) { setP(0, true); return; }
      busy = true; setP(52, true); ptr.querySelector("svg").style.transform = ""; ptr.classList.add("go"); ptrT.textContent = "מרענן…";
      const t0 = Date.now();
      try { await Promise.all([load(true), S.tab === "war" ? loadWar() : null]); } catch {}
      if (Date.now() - t0 < 650) await sleep(650 - (Date.now() - t0));
      const n = S.fresh ? S.fresh.size : 0;
      ptr.classList.remove("go"); ptr.classList.add("ok");
      ptrT.textContent = n ? (n === 1 ? "ידיעה חדשה אחת" : `${n} ידיעות חדשות`) : "הכול מעודכן";
      buzz(n ? [10, 40, 10] : 6);
      await sleep(n ? 1100 : 750);
      busy = false; setP(0, true);
      setTimeout(() => { if (!busy) { ptr.classList.remove("ok"); ptrT.textContent = "משכו לרענון"; } }, 320);
    });
    window.addEventListener("touchcancel", resetP, { passive: true });
  })();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { load(); aiTick(); } else store.set("lastVisit", visitAt); });
  window.addEventListener("pagehide", () => store.set("lastVisit", visitAt));
  setInterval(() => { if (S.data) render(); }, 30000);

  // ---------- install as app ----------
  // ---------- always run the newest version ----------
  const BUILD = "20261108095752";
  let swReg = null;
  try { if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((r) => { swReg = r; }).catch(() => {}); } catch {}
  async function checkVersion(){
    try {
      const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" }); if (!r.ok) return;
      const v = await r.json();
      if (v.build && v.build !== BUILD) { if (swReg) { try { await swReg.update(); } catch {} } if (!$("sheet").classList.contains("open")) location.reload(); else S.pendingReload = true; }
    } catch {}
  }
  setTimeout(checkVersion, 4000); setInterval(checkVersion, 120000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) checkVersion(); });
  function installHelp(){
    const ua = navigator.userAgent;
    const ios = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const android = /android/i.test(ua);
    const inApp = /FBAN|FBAV|Instagram|Line\/|WhatsApp|Telegram|; wv\)/i.test(ua);
    if (inApp) return android ? `<b>פתח קודם בדפדפן:</b> ⋮ למעלה ← <b>"פתח ב-Chrome"</b>, ואז ⋮ ← <b>"הוסף למסך הבית"</b>` : `<b>פתח קודם בדפדפן:</b> לחץ על סמל הדפדפן / <b>"פתח ב-Safari"</b>, ואז <b>שתף ⬆︎ ← "הוסף למסך הבית"</b>`;
    if (ios && /CriOS/i.test(ua)) return `<b>שמור כאפליקציה ב-Chrome:</b> לחץ על <b>שתף ⬆︎</b> בשורת הכתובת למעלה ← גלול למטה ← <b>"הוסף למסך הבית"</b>`;
    if (ios && /EdgiOS|FxiOS/i.test(ua)) return `<b>שמור כאפליקציה:</b> לחץ על <b>שתף ⬆︎</b> ← <b>"הוסף למסך הבית"</b>. אם אין אפשרות כזו, פתח את הקישור ב-Safari`;
    if (ios) return `<b>שמור כאפליקציה:</b> לחץ על <b>שתף ⬆︎</b> (או <b>⋯</b> ← שתף) ← <b>"הוסף למסך הבית"</b>, והשאר את "פתח כאפליקציה" דלוק`;
    if (android) return `<b>שמור כאפליקציה:</b> בתפריט <b>⋮</b> של Chrome בחר <b>"התקן אפליקציה"</b> או <b>"הוסף למסך הבית"</b>`;
    return `<b>במחשב:</b> בשורת הכתובת של Chrome לחץ על סמל ההתקנה ⊕, או ⋮ ← "שמירה ושיתוף" ← "התקנת הדף כאפליקציה"`;
  }
  let deferredInstall = null;
  (function(){
    const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
    const mobile = /android|iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const box = $("install"), txt = $("installTxt"), btn = $("installBtn");
    const show = (html, withBtn) => { txt.innerHTML = html; btn.classList.toggle("hide", !withBtn); box.classList.remove("hide"); };
    window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferredInstall = e; if (!standalone && store.get("installDismissed", 0) < Date.now() - 3 * 864e5) show(`<b>שמור כאפליקציה</b> על מסך הבית — נפתח במסך מלא ומתעדכן לבד`, true); });
    btn.onclick = async () => { if (!deferredInstall) return; deferredInstall.prompt(); try { await deferredInstall.userChoice; } catch {} deferredInstall = null; box.classList.add("hide"); };
    $("installX").onclick = () => { box.classList.add("hide"); store.set("installDismissed", Date.now()); };
    if (standalone || !mobile || store.get("installDismissed", 0) > Date.now() - 3 * 864e5) return;
    setTimeout(() => { if (box.classList.contains("hide")) show(installHelp(), false); }, /android/i.test(navigator.userAgent) ? 3500 : 800);
  })();
  // ---------- boot (public read-only) ----------
  S.mcp = {}; S.sample = null;
  load(true).then(() => loadLogos());
  setInterval(() => { if (!document.hidden) load(); }, 60000);
  setInterval(() => { if (!document.hidden) loadWar(); }, 120000);
  setTimeout(loadWar, 1500);
  setTimeout(() => store.set("lastVisit", visitAt), 5 * 60000);
})();
</script>
