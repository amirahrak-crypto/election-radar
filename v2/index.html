<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#090c12">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="חילופי שלטון">
<title>חילופי שלטון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090c12; --s1:#0f141c; --s2:#151b26; --s3:#1c2430; --ln:rgba(255,255,255,.075); --ln2:rgba(255,255,255,.12);
  --t1:#f1f4f8; --t2:#b4bccb; --t3:#7b8597; --t4:#566073;
  --red:#ff5263; --amber:#f6b643; --green:#38d39f; --blue:#62adff;
  --redbg:rgba(255,82,99,.12); --amberbg:rgba(246,182,67,.11); --bluebg:rgba(98,173,255,.11);
  --rad:18px; --pad:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t1);font-family:Heebo,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.hide{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:0 var(--pad)}

/* top */
.top{position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top);background:rgba(9,12,18,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.top .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px var(--pad) 10px}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:19px;font-weight:800;letter-spacing:-.4px;line-height:1.1}
.brand span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t3);font-weight:500;margin-top:2px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(56,211,159,.15)}
.dot.off{background:var(--t4);box-shadow:none}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--t2);background:var(--s1);border:1px solid var(--ln)}
.ib:active{transform:scale(.94)}
.ib.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* alert banner (only when something really happens) */
.alert{margin:6px 0 4px;border-radius:14px;padding:11px 14px;display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600;line-height:1.35}
.alert.emg{background:var(--red);color:#fff}
.alert.esc{background:var(--amberbg);color:#ffd892;border:1px solid rgba(246,182,67,.3)}
.alert b{font-weight:800}

/* section headers */
.sh{display:flex;align-items:baseline;gap:8px;margin:26px 2px 10px}
.sh h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.3px}
.sh span{font-size:12.5px;color:var(--t3);font-weight:500}
.sh .more{margin-inline-start:auto;font-size:13px;color:var(--blue);font-weight:600}

/* status (process) card */
.pc{margin-top:10px;background:var(--s1);border:1px solid var(--ln);border-radius:var(--rad);padding:14px 15px 13px;display:block;width:100%;text-align:right}
.pc-top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t3);font-weight:600}
.pc-top i{font-style:normal;margin-inline-start:auto;color:var(--t3);font-weight:500}
.pc-main{display:flex;gap:12px;margin-top:9px;align-items:stretch}
.pc-a{flex:1.35;min-width:0}
.pc-a .k{font-size:12.5px;color:var(--t3);font-weight:500}
.pc-a .v{font-size:19px;font-weight:800;letter-spacing:-.3px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-bar{height:5px;border-radius:3px;background:var(--s3);margin-top:9px;overflow:hidden}
.pc-bar i{display:block;height:100%;border-radius:3px;background:var(--blue)}
.pc-a .s{display:flex;justify-content:space-between;font-size:11.5px;color:var(--t3);margin-top:5px;font-weight:500}
.pc-a .s b{color:var(--t1);font-weight:700}
.pc-b{flex:1;min-width:0;border-inline-start:1px solid var(--ln);padding-inline-start:12px}
.pc-b .k{font-size:12.5px;color:var(--t3);font-weight:500}
.pc-b .big{display:flex;align-items:baseline;gap:5px;margin-top:1px}
.pc-b .big b{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.05}
.pc-b .big span{font-size:13px;color:var(--t2);font-weight:600}
.pc-b .s{font-size:11.5px;color:var(--t3);margin-top:5px;font-weight:500}

/* lead digest */
.dg{background:var(--s1);border:1px solid var(--ln);border-radius:var(--rad);overflow:hidden}
.di{display:flex;gap:12px;padding:14px 15px;border-top:1px solid var(--ln);cursor:pointer;width:100%;text-align:right}
.di:first-child{border-top:0}
.di:active{background:var(--s2)}
.dn{flex:none;width:24px;font-size:22px;font-weight:800;color:var(--t4);line-height:1.15;text-align:center}
.di.l3 .dn{color:var(--red)}.di.l2 .dn{color:var(--amber)}
.db{flex:1;min-width:0}
.dt{font-size:16.5px;font-weight:700;line-height:1.38;letter-spacing:-.15px}
.di.lead .dt{font-size:19.5px;font-weight:800;line-height:1.3;letter-spacing:-.3px}
.dsum{font-size:14px;color:var(--t2);line-height:1.5;margin-top:6px}
.meta{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:12px;color:var(--t3);font-weight:500;min-width:0;flex-wrap:nowrap}
.meta .sep{color:var(--t4)}
.lvl{font-weight:700;font-size:12px;white-space:nowrap}
.lvl.l3{color:var(--red)}.lvl.l2{color:var(--amber)}
.stack{display:inline-flex;flex-direction:row-reverse;align-items:center}
.stack .lg{margin-inline-start:-5px;box-shadow:0 0 0 2px var(--s1)}
.stack .lg:last-child{margin-inline-start:0}
.lg{width:17px;height:17px;border-radius:5px;object-fit:cover;display:inline-grid;place-items:center;font-size:9.5px;font-weight:800;color:#fff;flex:none;background:#2a3446}
.nsrc{white-space:nowrap}
.tm{margin-inline-start:auto;white-space:nowrap;color:var(--t3)}
.newb{font-size:10.5px;font-weight:800;color:#0b0f15;background:var(--blue);border-radius:5px;padding:1px 5px}
.empty{padding:18px 16px;color:var(--t3);font-size:14px;line-height:1.5}

/* bottom line */
.bl{background:transparent;border-radius:var(--rad);padding:2px 2px 0}
.bl-i{position:relative;padding:7px 18px 7px 0;font-size:14.5px;line-height:1.55;color:var(--t2)}
.bl-i::before{content:"";position:absolute;right:3px;top:15px;width:6px;height:6px;border-radius:2px;background:var(--t4)}
.bl-i:first-child::before{background:var(--blue)}
.bl-i:first-child{color:var(--t1);font-weight:500}
.bl-at{font-size:11.5px;color:var(--t4);margin-top:4px;padding-inline-start:18px}

/* security row */
.sec{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--s1);border:1px solid var(--ln);border-radius:var(--rad);padding:13px 15px}
.sec .ic{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--s3);color:var(--t2)}
.sec.esc .ic{background:var(--amberbg);color:var(--amber)}.sec.emg .ic{background:var(--redbg);color:var(--red)}
.sec .tx{flex:1;min-width:0}
.sec .tx b{display:block;font-size:15px;font-weight:700}
.sec .tx span{display:block;font-size:13px;color:var(--t3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--t4);flex:none}

/* compact list */
.ls{background:var(--s1);border:1px solid var(--ln);border-radius:var(--rad);overflow:hidden}
.li{display:block;width:100%;text-align:right;padding:12px 15px;border-top:1px solid var(--ln);cursor:pointer}
.li:first-child{border-top:0}
.li:active{background:var(--s2)}
.lt{font-size:15px;font-weight:600;line-height:1.42;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.li .meta{margin-top:6px}
.tag{font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--s3);color:var(--t2);white-space:nowrap}
.tag.ts{background:rgba(98,173,255,.12);color:#9fcbff}
.tag.s3{background:var(--redbg);color:#ff8d98}
.allbtn{display:block;width:100%;margin-top:10px;padding:13px;border-radius:14px;background:var(--s1);border:1px solid var(--ln);font-size:14px;font-weight:600;color:var(--t2);text-align:center}

/* feed controls */
.ctl{position:sticky;top:calc(env(safe-area-inset-top) + 62px);z-index:20;background:var(--bg);padding:8px 0 10px;margin:0 calc(var(--pad) * -1);padding-inline:var(--pad)}
.seg{display:flex;background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:3px}
.seg button{flex:1;padding:8px 0;border-radius:9px;font-size:14px;font-weight:600;color:var(--t3)}
.seg button.on{background:var(--s3);color:var(--t1)}
.ctl2{display:flex;align-items:center;gap:8px;margin-top:9px}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t2);font-weight:500}
.sw i{width:34px;height:20px;border-radius:10px;background:var(--s3);position:relative;transition:.2s}
.sw i::after{content:"";position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:var(--t3);transition:.2s}
.sw.on i{background:var(--blue)}.sw.on i::after{right:16px;background:#fff}
.srch{flex:1;min-width:0;background:var(--s1);border:1px solid var(--ln);border-radius:10px;padding:7px 10px;font:inherit;font-size:14px;color:var(--t1);outline:0}
.srch::placeholder{color:var(--t4)}
.grp{font-size:12.5px;color:var(--t3);font-weight:700;margin:18px 4px 8px}
.grp:first-child{margin-top:6px}

/* process tab */
.hero{background:linear-gradient(160deg,#121a28,#0f141c 60%);border:1px solid var(--ln);border-radius:22px;padding:18px 18px 16px;margin-top:10px}
.hero .k{font-size:12.5px;color:var(--t3);font-weight:600}
.hero h1{margin:4px 0 0;font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1.2}
.hero .row{display:flex;align-items:center;gap:16px;margin-top:16px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{display:block;font-size:28px;font-weight:800;line-height:1}
.ring .c span{font-size:11px;color:var(--t3);font-weight:600}
.facts{flex:1;display:grid;gap:8px}
.fact{display:flex;justify-content:space-between;font-size:13.5px;color:var(--t3);border-bottom:1px solid var(--ln);padding-bottom:7px}
.fact:last-child{border:0;padding:0}
.fact b{color:var(--t1);font-weight:600}
.steps{position:relative;margin-top:4px;background:var(--s1);border:1px solid var(--ln);border-radius:var(--rad);padding:6px 15px}
.st{display:flex;gap:13px;padding:11px 0;position:relative}
.st .m{flex:none;width:14px;display:flex;flex-direction:column;align-items:center;padding-top:4px}
.st .m i{width:12px;height:12px;border-radius:50%;border:2px solid var(--t4);background:var(--bg);z-index:1}
.st.done .m i{background:var(--green);border-color:var(--green)}
.st.cur .m i{background:var(--blue);border-color:var(--blue);box-shadow:0 0 0 4px rgba(98,173,255,.2)}
.st .m::after{content:"";position:absolute;top:22px;bottom:-4px;width:2px;background:var(--s3)}
.st:last-child .m::after{display:none}
.st.done .m::after{background:rgba(56,211,159,.4)}
.st .x{flex:1;min-width:0}
.st .x b{display:block;font-size:15px;font-weight:700}
.st.todo .x b{color:var(--t2);font-weight:600}
.st .x span{display:block;font-size:12.5px;color:var(--t3);margin-top:2px}
.st .d{font-size:12.5px;color:var(--t3);font-weight:600;white-space:nowrap}
.st.cur .d{color:var(--blue)}
.recs{background:var(--s1);border:1px solid var(--ln);border-radius:var(--rad);padding:15px}
.rbar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:10px 0 8px}
.rbar i{display:block;height:100%}
.rleg{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--t2)}
.rleg b{font-weight:800;color:var(--t1)}
.rleg u{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:5px;text-decoration:none}
.prt{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--ln);font-size:14px}
.prt:first-of-type{margin-top:12px}
.prt .n{flex:1;font-weight:600}
.prt .s{width:26px;text-align:center;font-weight:800;color:var(--t2)}
.prt .r{font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
.r.e{background:rgba(98,173,255,.13);color:#9fcbff}.r.n{background:rgba(246,182,67,.12);color:#ffd892}.r.x{background:var(--s3);color:var(--t3)}

/* security tab */
.sstat{display:flex;align-items:center;gap:10px;margin-top:12px}
.lvchip{font-size:13px;font-weight:800;padding:4px 10px;border-radius:8px;background:var(--s2);color:var(--t2)}
.lvchip.esc{background:var(--amberbg);color:var(--amber)}.lvchip.emg{background:var(--red);color:#fff}
.sstat span{font-size:13px;color:var(--t3)}
.map{position:relative;margin-top:12px;border-radius:20px;overflow:hidden;border:1px solid var(--ln);background:#070b12}
.map svg{display:block;width:100%;height:auto}
.map .land{fill:#141b27;stroke:#222c3b;stroke-width:.8}
.map .isr{fill:#3a5f96;stroke:#7fb0ff;stroke-width:1}
.map .ar{fill:#1a2333;stroke:#2b374a;stroke-width:.9}
.map .ar.on{fill:#1f2a3d}
.map .ar.esc{fill:#3a2e17;stroke:#7a5d24}
.map .ar.emg{fill:#45161d;stroke:#a0303e}
.map .grat{stroke:rgba(140,160,200,.05);fill:none}
.map .rng{fill:none;stroke:rgba(98,173,255,.13);stroke-dasharray:3 5}
.map .rngt{fill:rgba(160,180,220,.35);font-size:12px;font-family:Heebo}
.mp{position:absolute;display:flex;align-items:center;gap:5px;background:rgba(15,20,28,.92);border:1px solid var(--ln2);border-radius:9px;padding:3px 8px;font-size:12px;font-weight:700;color:var(--t2);white-space:nowrap}
.mp i{font-style:normal;min-width:17px;height:17px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;background:var(--s3);color:var(--t1);padding:0 4px}
.mp.on{color:var(--t1)}.mp.on i{background:var(--blue);color:#081018}
.mp.esc{border-color:rgba(246,182,67,.5)}.mp.esc i{background:var(--amber);color:#1a1000}
.mp.emg{border-color:var(--red);background:rgba(80,14,22,.95);color:#fff}.mp.emg i{background:var(--red);color:#fff}
.mp.mute{opacity:.45}
.chips{display:flex;gap:6px;overflow-x:auto;margin:14px calc(var(--pad) * -1) 0;padding:0 var(--pad) 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--s1);border:1px solid var(--ln);color:var(--t2)}
.chip.on{background:var(--t1);color:#0b0f15;border-color:var(--t1)}

/* bottom tabs */
.tabs{position:fixed;bottom:0;inset-inline:0;z-index:30;background:rgba(11,14,20,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{max-width:640px;margin:0 auto;display:flex}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11.5px;font-weight:600;color:var(--t3);position:relative}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--t1)}
.tabs button .bd{position:absolute;top:6px;left:calc(50% - 18px);min-width:8px;height:8px;border-radius:4px;background:var(--red)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:60;visibility:hidden}
#sheet.open{visibility:visible}
#sheet .bk{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .25s}
#sheet.open .bk{opacity:1}
#panel{position:absolute;bottom:0;inset-inline:0;max-width:640px;margin:0 auto;max-height:88vh;overflow-y:auto;background:#10151e;border-radius:22px 22px 0 0;border-top:1px solid var(--ln2);transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:0 18px calc(24px + env(safe-area-inset-bottom));overscroll-behavior:contain}
#sheet.open #panel{transform:none}
.ph{position:sticky;top:0;background:#10151e;padding:10px 0 6px;z-index:2;display:flex;align-items:center}
.ph .grab{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:38px;height:4px;border-radius:2px;background:var(--s3)}
.ph button{margin-inline-start:auto;margin-top:8px;width:32px;height:32px;border-radius:50%;background:var(--s2);display:grid;place-items:center;color:var(--t2)}
.sk2{font-size:12.5px;color:var(--t3);font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#panel h3{margin:8px 0 0;font-size:22px;font-weight:800;line-height:1.3;letter-spacing:-.3px}
.ssum{font-size:15px;color:var(--t2);line-height:1.6;margin-top:10px}
.swhy{font-size:14px;color:var(--t1);background:var(--s2);border-radius:12px;padding:10px 12px;margin-top:12px;line-height:1.5}
.rh{font-size:13px;font-weight:700;color:var(--t3);margin:20px 0 4px}
.rep{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--ln);align-items:flex-start}
.rep .lg{width:22px;height:22px;border-radius:6px;font-size:11px;margin-top:2px}
.rep .x{flex:1;min-width:0}
.rep .o{font-size:12.5px;color:var(--t3);font-weight:600;display:flex;gap:6px}
.rep .t{font-size:14.5px;line-height:1.45;margin-top:2px;color:var(--t1)}
.rep svg{flex:none;color:var(--t4);margin-top:4px}

/* skeleton + ptr */
.skel{background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1));background-size:200% 100%;animation:sh 1.3s infinite;border-radius:var(--rad)}
@keyframes sh{to{background-position:-200% 0}}
#ptr{position:fixed;top:calc(env(safe-area-inset-top) + 64px);left:50%;transform:translate(-50%,-60px);z-index:25;background:var(--s2);border:1px solid var(--ln2);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--t2);display:flex;gap:7px;align-items:center;opacity:0;transition:opacity .15s}
#ptr.vis{opacity:1}
#ptr.go svg{animation:spin .8s linear infinite}
.foot{font-size:11.5px;color:var(--t4);text-align:center;margin:22px 0 8px;line-height:1.6}
.toast{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--t1);color:#0b0f15;font-size:13.5px;font-weight:700;padding:10px 16px;border-radius:12px;z-index:70;box-shadow:0 8px 30px rgba(0,0,0,.4)}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand"><b>חילופי שלטון</b><span><i class="dot" id="dot"></i><span id="upd">טוען…</span></span></div>
  <button class="ib" id="bRef" aria-label="רענון"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg></button>
</div></header>
<div id="ptr"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg><span id="ptrT">משכו לרענון</span></div>
